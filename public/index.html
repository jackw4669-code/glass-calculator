<script>
const e = React.createElement;
const { useState, useEffect, Fragment } = React;

/* ============================================================
   PRICE LIST
   These are the current selling prices per m² (or per linear
   metre for edgework). What you see is what is charged — no
   hidden multiplier. To move prices across the board, use the
   Prices panel in the header rather than editing every line.
   ============================================================ */

const VAT_RATE  = 0.20;
const CARD_FEE  = 0.02;
const STORE_KEY = 'wilsons_glass_quotes';
const ADJ_KEY   = 'wilsons_glass_price_adjust';

/* Minimum chargeable area by category */
const MIN_AREA = {

  'Toughened':           0.2,
  'DEFAULT':             0.1,

const PRODUCTS = [

  { id:'dglam',   name:'Laminated units',                 category:'Double Glazed Units', price:165.00 },
  { id:'dgleadt', name:'Leaded toughened',                category:'Double Glazed Units', price:187.00 },
  { id:'dglowe',  name:'Low E',                           category:'Double Glazed Units', price:132.00 },

  { id:'dglowel', name:'Low E leaded',                    category:'Double Glazed Units', price:181.50 },

const HORTICULTURAL = [
  { id:'h1', name:'610 × 457',  price:8.80  },
  { id:'h2', name:'610 × 610',  price:9.90  },
  { id:'h3', name:'1207 × 703', price:25.85 },
];

/* charge: 'lm' per linear metre (defaults to perimeter) | 'm2' per m² | 'each' per unit */
const ADDONS = [
  { id:'pol-std', name:'Polished edges',         detail:'Rectangles, up to 8 MM',   charge:'lm', price:5.50,  group:'Edgework' },
  { id:'pol-10',  name:'Polished edges — 10 MM', detail:'Thicker glass rate',       charge:'lm', price:9.90,  group:'Edgework' },
  { id:'bev-str', name:'1" straight bevel',      detail:'',                         charge:'lm', price:14.30, group:'Edgework' },
  { id:'bev-shp', name:'1" shaped bevel',        detail:'Curved or profiled edges', charge:'lm', price:28.60, group:'Edgework' },
  { id:'leading', name:'Leading',                detail:'Applied over the pane',    charge:'m2', price:51.99, group:'Decorative' },
  { id:'obsunit', name:'Obscure glass in unit',  detail:'Double-glazed units only', charge:'m2', price:11.00, group:'Unit options' },
];

const PRESETS = [
  { label:'1000 × 800',  height:1000, width:800  },
  { label:'1200 × 1200', height:1200, width:1200 },
  { label:'1500 × 800',  height:1500, width:800  },
  { label:'900 × 600',   height:900,  width:600  },
];

/* ---------- helpers ---------- */
const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);
const money = n => '£' + num(n).toFixed(2);

const STORAGE_OK = (() => {
  try {
    localStorage.setItem('__wg_probe', '1');
    localStorage.removeItem('__wg_probe');
    return true;
  } catch (err) { return false; }
})();

/* Totals. Extras (labour, delivery and so on) are added AFTER any
   discount, so a trade discount applies to the glass but not to
   labour. Move extrasTotal above the discount line if you'd rather
   discount everything. */
function computeTotals(items, discountPct, cardFee, extras) {
  const list           = Array.isArray(extras) ? extras : [];
  const subtotal       = items.reduce((s, i) => s + num(i.total), 0);
  const pct            = num(discountPct);
  const discountAmount = subtotal * (pct / 100);
  const afterDiscount  = subtotal - discountAmount;
  const extrasTotal    = list.reduce((s, x) => s + num(x.amount), 0);
  const net            = afterDiscount + extrasTotal;
  const vat            = net * VAT_RATE;
  const beforeCard     = net + vat;
  const cardAmount     = cardFee ? beforeCard * CARD_FEE : 0;
  return {
    subtotal, discountAmount, afterDiscount, extrasTotal, net, vat, cardAmount,
    grandTotal: beforeCard + cardAmount,
    totalM2: items.reduce((s, i) => s + num(i.totalArea), 0),
    totalLm: items.reduce((s, i) => s +
      (i.addons || []).filter(a => a.charge === 'lm').reduce((t, a) => t + num(a.qty), 0), 0),
  };
}

/* Older builds used different field names and had no extras array.
   Normalise everything on the way in so one stale record can't take
   the panel down. */
function normaliseQuote(q) {
  if (!q || typeof q !== 'object') return null;

  const items = (Array.isArray(q.items) ? q.items : []).map((i, idx) => {
    const area  = num(i.totalArea);
    const glass = num(i.glassCost !== undefined ? i.glassCost : i.markedUpPrice);
    const addons = (Array.isArray(i.addons) ? i.addons : []).map(a => ({
      id: a.id || 'addon', name: a.name || 'Add-on',
      charge: a.charge || 'm2', rate: num(a.rate),
      qty: num(a.qty), cost: num(a.cost),
    }));
    return {
      key: i.key || i.id || (Date.now() + idx),
      productName: i.productName || 'Glass',
      category: i.category || '',
      height: num(i.height), width: num(i.width), unit: i.unit || 'mm',
      quantity: num(i.quantity) || 1,
      totalArea: area,
      totalPerim: num(i.totalPerim),
      glassRate: num(i.glassRate !== undefined ? i.glassRate : (area ? glass / area : 0)),
      glassCost: glass,
      addons,
      total: num(i.total !== undefined ? i.total : glass + addons.reduce((s, a) => s + a.cost, 0)),
    };
  });

  const extras = (Array.isArray(q.extras) ? q.extras : []).map((x, idx) => ({
    id: x.id || (Date.now() + idx),
    label: x.label || 'Extra cost',
    amount: num(x.amount),
  }));

  const discountPct = num(q.discountPct !== undefined ? q.discountPct : q.discountPercent);
  const cardFee = !!q.cardFee;

  return {
    id: q.id || Date.now(),
    ref: q.ref || q.quoteNumber || 'Q------',
    date: q.date || new Date().toLocaleDateString('en-GB'),
    edited: q.edited || '',
    sent: q.sent || '',
    customerName: q.customerName || 'No name given',
    customerEmail: q.customerEmail || '',
    notes: q.notes || '',
    items, extras, discountPct, cardFee,
    totals: computeTotals(items, discountPct, cardFee, extras),
  };
}

/* Text a search box should match against */
const quoteHaystack = q => [
  q.ref, q.customerName, q.customerEmail, q.notes, q.date,
  ...q.items.map(i => i.productName + ' ' + i.category),
  ...q.extras.map(x => x.label),
].join(' ').toLowerCase();

/* Common extras, offered as one-tap labels */
const EXTRA_PRESETS = ['Labour', 'Fitting', 'Delivery', 'Waste removal', 'Survey'];

const newRef = () => 'Q' + Date.now().toString().slice(-6);

/* ---------- email ----------
   A file served from a static host has no server to send mail from,
   so the quote is handed to whatever mail client the person already
   uses, pre-filled and ready. They press Send, which means it leaves
   from the shop's own address and replies come back there.

   Note on length: a desktop client opened via mailto: generally caps
   pre-filled text near 2000 characters. The web compose URLs take far
   more. composeLinks reports the encoded length so the UI can warn. */
const composeLinks = (to, subject, body) => {
  const t = encodeURIComponent(to || '');
  const s = encodeURIComponent(subject || '');
  const b = encodeURIComponent(body || '');
  return {
    mailto:  'mailto:' + t + '?subject=' + s + '&body=' + b,
    outlook: 'https://outlook.live.com/mail/0/deeplink/compose?to=' + t + '&subject=' + s + '&body=' + b,
    gmail:   'https://mail.google.com/mail/?view=cm&fs=1&to=' + t + '&su=' + s + '&body=' + b,
    length:  b.length,
  };
};

function Calculator() {
  const [height, setHeight]       = useState('');
  const [width, setWidth]         = useState('');
  const [quantity, setQuantity]   = useState('1');
  const [unit, setUnit]           = useState('mm');
  const [productId, setProductId] = useState('c6mm');

  const [activeAddons, setActiveAddons] = useState([]);
  const [addonMetres, setAddonMetres]   = useState({});

  const [lineItems, setLineItems] = useState([]);
  const [extras, setExtras]       = useState([]);
  const [extraLabel, setExtraLabel]   = useState('');
  const [extraAmount, setExtraAmount] = useState('');
  const [discount, setDiscount]   = useState('0');
  const [cardFee, setCardFee]     = useState(false);

  const [customerName, setCustomerName]   = useState('');
  const [customerEmail, setCustomerEmail] = useState('');
  const [notes, setNotes]                 = useState('');

  const [draftRef, setDraftRef] = useState(newRef);

  const [savedQuotes, setSavedQuotes] = useState([]);
  const [showQuotes, setShowQuotes]   = useState(false);
  const [search, setSearch]           = useState('');
  const [editingId, setEditingId]     = useState(null);

  const [showEmail, setShowEmail]       = useState(false);
  const [emailTo, setEmailTo]           = useState('');
  const [emailSubject, setEmailSubject] = useState('');
  const [emailMessage, setEmailMessage] = useState('');

  const [showPrices, setShowPrices] = useState(true);
  const [showAdjust, setShowAdjust] = useState(false);
  const [adjust, setAdjust]         = useState('0');
  const [toast, setToast]           = useState('');

  useEffect(() => {
    if (!STORAGE_OK) return;
    let parsed = [];
    try { parsed = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (err) { parsed = []; }
    if (!Array.isArray(parsed)) parsed = [];
    const clean = parsed.map(normaliseQuote).filter(Boolean);
    setSavedQuotes(clean);
    if (clean.length) { try { localStorage.setItem(STORE_KEY, JSON.stringify(clean)); } catch (err) {} }
    try {
      const a = localStorage.getItem(ADJ_KEY);
      if (a !== null) setAdjust(a);
    } catch (err) {}
  }, []);

  const flash = msg => { setToast(msg); setTimeout(() => setToast(''), 2600); };

  const persist = list => {
    setSavedQuotes(list);
    if (!STORAGE_OK) return false;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }
    catch (err) { return false; }
  };

  const setAdjustment = v => {
    setAdjust(v);
    if (STORAGE_OK) { try { localStorage.setItem(ADJ_KEY, v); } catch (err) {} }
  };

  /* ---------- price adjustment ---------- */
  const adjPct = num(adjust);
  const rate = p => p * (1 + adjPct / 100);

  /* ---------- geometry ---------- */
  const toMm = v => {
    const n = parseFloat(v);
    if (!n) return 0;
    return unit === 'mm' ? n : unit === 'cm' ? n * 10 : unit === 'inches' ? n * 25.4 : n * 304.8;
  };

  const product    = PRODUCTS.find(p => p.id === productId);
  const hMm        = toMm(height);
  const wMm        = toMm(width);
  const qty        = Math.max(1, parseInt(quantity) || 1);
  const rawArea    = (hMm * wMm) / 1000000;
  const minArea    = MIN_AREA[product.category] !== undefined ? MIN_AREA[product.category] : MIN_AREA.DEFAULT;
  const totalArea  = rawArea > 0 ? Math.max(rawArea, minArea) * qty : 0;
  const totalPerim = (hMm && wMm) ? ((hMm * 2 + wMm * 2) / 1000) * qty : 0;

  const metresFor = id => {
    const o = addonMetres[id];
    return (o === undefined || o === '') ? totalPerim : (parseFloat(o) || 0);
  };

  const addonCost = a =>
    a.charge === 'lm' ? rate(a.price) * metresFor(a.id)
  : a.charge === 'm2' ? rate(a.price) * totalArea
  :                     rate(a.price) * qty;

  const toggleAddon = id =>
    setActiveAddons(activeAddons.includes(id)
      ? activeAddons.filter(x => x !== id)
      : [...activeAddons, id]);

  const glassCost   = rate(product.price) * totalArea;
  const addonsCost  = activeAddons.reduce((s, id) => s + addonCost(ADDONS.find(a => a.id === id)), 0);
  const linePreview = glassCost + addonsCost;

  const addLineItem = () => {
    if (!hMm || !wMm) { flash('Enter a height and a width first.'); return; }
    const addons = activeAddons.map(id => {
      const a = ADDONS.find(x => x.id === id);
      return {
        id: a.id, name: a.name, charge: a.charge, rate: rate(a.price),
        qty: a.charge === 'lm' ? metresFor(a.id) : a.charge === 'm2' ? totalArea : qty,
        cost: addonCost(a),
      };
    });
    setLineItems([...lineItems, {
      key: Date.now(),
      productName: product.name, category: product.category,
      height: parseFloat(height), width: parseFloat(width), unit,
      quantity: qty, totalArea, totalPerim,
      glassRate: rate(product.price),
      glassCost, addons, total: linePreview,
    }]);
    setHeight(''); setWidth(''); setQuantity('1');
    setActiveAddons([]); setAddonMetres({});
  };

  const removeLine = key => setLineItems(lineItems.filter(i => i.key !== key));

  /* ---------- extra costs ---------- */
  const addExtra = () => {
    const amt = parseFloat(extraAmount);
    if (!extraLabel.trim()) { flash('Give the extra cost a name.'); return; }
    if (!isFinite(amt) || amt === 0) { flash('Enter an amount.'); return; }
    setExtras([...extras, { id: Date.now(), label: extraLabel.trim(), amount: amt }]);
    setExtraLabel(''); setExtraAmount('');
  };

  const removeExtra = id => setExtras(extras.filter(x => x.id !== id));

  const discountPct = num(discount);
  const T = computeTotals(lineItems, discountPct, cardFee, extras);
  const hasContent = lineItems.length > 0 || extras.length > 0;

  /* ---------- quote builder ---------- */
  const resetBuilder = () => {
    setLineItems([]); setExtras([]); setExtraLabel(''); setExtraAmount('');
    setDiscount('0'); setCardFee(false);
    setCustomerName(''); setCustomerEmail(''); setNotes('');
    setEditingId(null);
    setDraftRef(newRef());
    setShowEmail(false);
  };

  const editingQuote = editingId ? savedQuotes.find(q => q.id === editingId) : null;

  const saveQuote = (asNew) => {
    if (!hasContent) { flash('Add something to the quote before saving.'); return; }
    const today = new Date().toLocaleDateString('en-GB');

    if (editingId && !asNew) {
      const existing = savedQuotes.find(q => q.id === editingId);
      const updated = savedQuotes.map(q => q.id === editingId ? Object.assign({}, q, {
        customerName: customerName || 'No name given',
        customerEmail, notes,
        items: lineItems, extras, discountPct, cardFee, totals: T,
        edited: today,
      }) : q);
      const ok = persist(updated);
      flash(ok ? ('Updated ' + (existing ? existing.ref : '')) : 'Updated — this session only');
      return;
    }

    const ref = draftRef;
    const id = Date.now();
    const ok = persist([...savedQuotes, {
      id, ref, date: today, edited: '', sent: '',
      customerName: customerName || 'No name given',
      customerEmail, notes,
      items: lineItems, extras, discountPct, cardFee, totals: T,
    }]);
    setEditingId(id);
    flash(ok ? ('Saved as ' + ref) : ('Saved as ' + ref + ' — this session only'));
  };

  const editQuote = q => {
    setLineItems(q.items);
    setExtras(q.extras || []);
    setDiscount(String(q.discountPct));
    setCardFee(!!q.cardFee);
    setCustomerName(q.customerName === 'No name given' ? '' : q.customerName);
    setCustomerEmail(q.customerEmail || '');
    setNotes(q.notes || '');
    setEditingId(q.id);
    setShowQuotes(false);
    flash('Editing ' + q.ref);
  };

  const deleteQuote = id => {
    persist(savedQuotes.filter(q => q.id !== id));
    if (id === editingId) setEditingId(null);
  };


  /* The reference is pinned for the life of the builder, so the saved
     quote, the downloaded file and the emailed copy all agree. */
  const activeRef = editingQuote ? editingQuote.ref : draftRef;

  /* Customer-facing quote text. Deliberately omits per-m² and per-metre
     rates, the m² each item was charged on, and the internal notes. */
  const buildQuoteText = () => {
    const W = 52;
    const row = (l, v) => l + ' '.repeat(Math.max(2, W - 10 - l.length)) + String(v).padStart(10);
    const L = [];

    L.push("WILSON'S GLASS");
    L.push("6 St Mary's Lane, Upminster, Essex");
    L.push('01708 224215   wilsons.glass@outlook.com');
    L.push('');
    L.push('QUOTE ' + activeRef);
    L.push('Date: ' + new Date().toLocaleDateString('en-GB'));
    if (customerName)  L.push('Customer: ' + customerName);
    L.push('');
    L.push('='.repeat(W));

    lineItems.forEach((i, n) => {
      L.push((n + 1) + '. ' + i.productName);
      L.push('   ' + i.height + i.unit + ' x ' + i.width + i.unit +
             (i.quantity > 1 ? '   ' + i.quantity + ' off' : ''));
      i.addons.forEach(a => {
        L.push('   + ' + a.name + (a.charge === 'lm' ? '  (' + a.qty.toFixed(2) + ' m)' : ''));
      });
      L.push(row('', money(i.total)));
      L.push('');
    });

    L.push('='.repeat(W));
    if (lineItems.length) L.push(row('Subtotal', money(T.subtotal)));
    if (discountPct > 0) {
      L.push(row('Discount ' + discountPct + '%', '-' + money(T.discountAmount)));
      L.push(row('After discount', money(T.afterDiscount)));
    }
    extras.forEach(x => L.push(row(x.label, money(x.amount))));
    L.push(row('VAT 20%', money(T.vat)));
    if (cardFee) L.push(row('Card surcharge 2%', money(T.cardAmount)));
    L.push('-'.repeat(W));
    L.push(row('TOTAL', money(T.grandTotal)));
    L.push('');
    L.push('Valid for 30 days.');
    L.push('Thank you for choosing Wilson\'s Glass.');
    return L.join('\n');
  };

  const exportQuote = () => {
    if (!hasContent) { flash('Add something to the quote first.'); return; }
    const blob = new Blob([buildQuoteText()], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'Quote_' + activeRef + '.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  /* ---------- email ---------- */
  const defaultMessage = () =>
    'Hi' + (customerName ? ' ' + customerName.split(' ')[0] : '') + ',\n\n' +
    'Thanks for your enquiry. Your quote is below.\n\n' +
    'If you would like to go ahead, or if anything needs changing, just reply to this ' +
    'email or give us a call on 01708 224215.\n\n' +
    'Kind regards,\nWilson\'s Glass';

  const openEmailPanel = () => {

                      showPrices && e('div', { className:'mt-1.5 pt-1.5 border-t border-slate-700/60 space-y-0.5' },
                        e('div', { className:'text-[11px] flex justify-between text-slate-400' },
                          e('span', null, 'Glass'), e('span', { className:'tabular-nums' }, money(i.glassCost))),
                        i.addons.map(a =>
                          e('div', { key:a.id, className:'text-[11px] flex justify-between text-slate-400' },
                            e('span', { className:'truncate pr-2' },
                              '+ ' + a.name + (a.charge === 'lm' ? ' (' + a.qty.toFixed(2) + 'm)' : '')),
                            e('span', { className:'tabular-nums' }, money(a.cost)))),
                        e('div', { className:'text-[13px] font-bold text-amber-400 text-right pt-0.5 tabular-nums' },
                          money(i.total)))))),

            e('div', { className:'bg-slate-900/60 rounded-lg border border-slate-700 p-3 mb-3' },
              e('div', { className:'flex items-baseline justify-between mb-2' },
                e('h3', { className:'text-[11px] font-bold uppercase tracking-wider text-slate-400' }, 'Extra costs'),
                extras.length > 0 && e('span', { className:'text-[11px] text-amber-400 font-semibold tabular-nums' },
                  money(T.extrasTotal))),

              extras.length > 0 && e('div', { className:'space-y-1 mb-2' },
                extras.map(x =>
                  e('div', { key:x.id, className:'flex items-center gap-2 text-[13px] bg-slate-900 rounded px-2.5 py-1.5 border border-slate-700' },
                    e('span', { className:'flex-1 truncate' }, x.label),
                    e('span', { className:'tabular-nums font-semibold text-amber-300' }, money(x.amount)),
                    e('button', { onClick:() => removeExtra(x.id),
                      className:'text-slate-500 hover:text-red-400 text-[11px]' }, '✕')))),

              e('div', { className:'flex gap-1.5 mb-2' },
                e('input', { className: input + ' flex-1', placeholder:'Labour, delivery, fitting…',
                  value:extraLabel, onChange:ev => setExtraLabel(ev.target.value),
                  onKeyDown:ev => { if (ev.key === 'Enter') addExtra(); } }),
                e('div', { className:'relative w-24' },
                  e('span', { className:'absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 text-sm' }, '£'),
                  e('input', { type:'number', inputMode:'decimal', step:'0.01', placeholder:'0.00',
                    value:extraAmount, onChange:ev => setExtraAmount(ev.target.value),
                    onKeyDown:ev => { if (ev.key === 'Enter') addExtra(); },
                    className: input + ' pl-5' })),
                e('button', { onClick:addExtra,
                  className:'px-3 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-semibold' }, 'Add')),

              e('div', { className:'flex flex-wrap gap-1' },
                EXTRA_PRESETS.map(p =>
                  e('button', { key:p, onClick:() => setExtraLabel(p),
                    className:'px-2 py-1 rounded bg-slate-900 hover:bg-slate-700 text-[10px] font-medium text-slate-400' }, p))),

              e('p', { className:'text-[10px] text-slate-500 mt-2 leading-snug' },
                'Added after any discount, before VAT — so a trade discount comes off the glass but not the labour.')),

            e('div', { className:'flex gap-2 mb-3' },
              e('div', { className:'flex-1' },
                e('label', { className: label }, 'Discount %'),
                e('input', { type:'number', inputMode:'decimal', min:'0', max:'100', value:discount,
                  onChange:ev => setDiscount(ev.target.value), className: input })),
              e('div', { className:'flex items-end gap-1.5' },
                e('button', { onClick:() => setDiscount('15'),
                  className:'px-2.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-700 text-[11px] font-semibold' }, 'Account 15%'),
                e('button', { onClick:() => setDiscount('25'),
                  className:'px-2.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-700 text-[11px] font-semibold' }, 'Trade 25%'))),

            e('label', { className:'flex items-center gap-2 mb-3 text-xs text-slate-300 cursor-pointer' },
              e('input', { type:'checkbox', checked:cardFee, onChange:() => setCardFee(!cardFee),
                className:'accent-amber-500' }),
              'Paying by card (adds 2%)'),

            hasContent && e('div', { className:'bg-slate-900 rounded-lg p-3 border border-slate-700 space-y-1 text-[13px] mb-3' },
              lineItems.length > 0 && e('div', { className:'flex justify-between text-slate-500 text-[11px]' },
                e('span', null, 'Area'), e('span', { className:'tabular-nums' }, T.totalM2.toFixed(2) + ' m²')),
              T.totalLm > 0 && e('div', { className:'flex justify-between text-slate-500 text-[11px]' },
                e('span', null, 'Edgework'), e('span', { className:'tabular-nums' }, T.totalLm.toFixed(2) + ' m')),
              lineItems.length > 0 && e('div', { className:'flex justify-between pt-1 border-t border-slate-700 text-slate-300' },
                e('span', null, 'Glass subtotal'), e('span', { className:'tabular-nums' }, money(T.subtotal))),
              discountPct > 0 && e(Fragment, null,
                e('div', { className:'flex justify-between text-emerald-400' },
                  e('span', null, 'Discount ' + discountPct + '%'),
                  e('span', { className:'tabular-nums' }, '−' + money(T.discountAmount))),
                e('div', { className:'flex justify-between text-slate-300' },
                  e('span', null, 'After discount'), e('span', { className:'tabular-nums' }, money(T.afterDiscount)))),
              extras.map(x =>
                e('div', { key:x.id, className:'flex justify-between text-slate-300' },
                  e('span', { className:'truncate pr-2' }, x.label),
                  e('span', { className:'tabular-nums' }, money(x.amount)))),
              e('div', { className:'flex justify-between text-slate-300' },
                e('span', null, 'VAT 20%'), e('span', { className:'tabular-nums' }, money(T.vat))),
              cardFee && e('div', { className:'flex justify-between text-slate-300' },
                e('span', null, 'Card 2%'), e('span', { className:'tabular-nums' }, money(T.cardAmount))),
              e('div', { className:'flex justify-between text-lg font-bold text-amber-400 pt-1.5 border-t border-slate-700' },
                e('span', null, 'Total'), e('span', { className:'tabular-nums' }, money(T.grandTotal)))),

            hasContent && e('div', { className:'grid grid-cols-3 gap-2' },
              e('button', { onClick:() => saveQuote(false),
                className:'py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold text-sm' },
                editingQuote ? 'Update' : 'Save'),
              e('button', { onClick:exportQuote,
                className:'py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold text-sm' },
                'Download'),
              e('button', { onClick:openEmailPanel,
                className:'py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-lg font-semibold text-sm' },
                'Email')),

            hasContent && editingQuote && e('button', { onClick:() => saveQuote(true),
              className:'w-full mt-2 py-2 rounded-lg bg-slate-900 hover:bg-slate-700 text-xs font-semibold' },
              'Save as a separate quote'),

            hasContent && e('button', {
              onClick:() => { if (confirm(editingQuote ? 'Clear the builder? The saved quote stays as it is.' : 'Clear this quote?')) resetBuilder(); },
              className:'w-full mt-1.5 py-1.5 text-[11px] text-slate-500 hover:text-red-400' },
              editingQuote ? 'Stop editing' : 'Clear quote')),

          e('div', { className: card + ' p-3 text-[11px] text-slate-500 leading-relaxed' },
            'Emailed and downloaded quotes show item and extra-cost totals only — no per-m² or per-metre rates, and no internal notes. Minimum charge 0.3 m² on double glazed units, 0.2 m² on toughened, 0.1 m² on everything else.'))),

      e('div', { className:'xl:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur border-t border-slate-700 px-4 py-2.5 flex items-center gap-3' },
        rawArea > 0 && showPrices && e('div', { className:'min-w-0' },
          e('div', { className:'text-[10px] text-slate-500 leading-tight' }, 'This item'),
          e('div', { className:'text-base font-bold text-amber-400 tabular-nums leading-tight' }, money(linePreview))),
        e('button', { onClick:addLineItem,
          className:'flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-lg font-bold text-sm' },
          'Add to quote'))
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(e(Calculator));
</script>
</body>
</html>
